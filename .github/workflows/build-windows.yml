name: Build Windows (VST3 + Standalone)

# Nur manuell starten (Actions-Tab → "Run workflow"), damit bei gesperrtem
# Actions-Kontingent nicht jeder Push eine Fehler-Mail auslöst.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JUCE holen (8.0.4)
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE external/JUCE

      - name: Konfigurieren (neuestes installiertes Visual Studio, x64)
        run: cmake -S . -B build -A x64 -DKICKFORGE_BUILD_TESTS=ON

      - name: Bauen (Release)
        run: cmake --build build --config Release --parallel

      - name: DSP-Tests
        run: build\KickforgeTests_artefacts\Release\KickforgeTests.exe

      - name: Paket schnüren
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build/Kickforge_artefacts/Release/VST3/Kickforge.vst3 dist/
          Copy-Item build/Kickforge_artefacts/Release/Standalone/Kickforge.exe dist/
          @"
          KICKFORGE - Installation (Windows, FL Studio)

          1) Den Ordner "Kickforge.vst3" kopieren nach:
             C:\Program Files\Common Files\VST3\
             (Windows fragt nach Admin-Bestaetigung - einfach bestaetigen)

          2) FL Studio: Options > Manage plugins > "Find installed plugins"
             Kickforge erscheint dann unter den Instrumenten (Generators).

          Kickforge.exe ist die Standalone-Version: startet ohne DAW,
          Audio-Ausgang oben links unter "Options" einstellen.
          "@ | Out-File -Encoding utf8 dist/INSTALLATION.txt
          Get-ChildItem -Recurse dist | Select-Object FullName, Length

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Kickforge-Windows-x64
          path: dist
          retention-days: 30
